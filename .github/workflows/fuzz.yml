name: Fuzz

# Longer fuzzing once a week (and on demand). Failing inputs are uploaded as
# an artifact and shown in the run summary.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      time:
        description: Time per fuzz test
        default: 5m

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - name: Fuzz
        # The input goes in through the environment, never into the script.
        env:
          FUZZ_TIME: ${{ github.event.inputs.time || '5m' }}
        run: |
          set -o pipefail
          bash build/fuzz.sh "$FUZZ_TIME" 2>&1 | grep -v '^fuzz: elapsed' | tee fuzz.log
      - name: Report failing inputs
        if: failure()
        run: |
          msg=$(tail -c 20000 fuzz.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Fuzz failure::$msg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashers
          path: internal/**/testdata/fuzz/**
