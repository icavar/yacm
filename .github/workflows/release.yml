name: Release

# A release from the browser: Actions > Release > Run workflow on main with
# the version (v0.8.10) builds all packages and prepares a draft GitHub
# release on that commit; Publish on the Releases page then creates the tag.
# The tag starts this workflow again, which sees the release and stops.
# Run workflow with the version empty builds the packages without a release
# (download them from the run's Artifacts section), e.g. a .dmg for testers.
# A tag pushed from a computer still works as before: packages and a draft.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.9.0 or v0.9.0-rc.1 (must match core/version.go). Empty: packages only, no release.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  plan:
    name: What to build
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to see draft releases
    outputs:
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # to check that a release commit is on main
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = push ]; then TAG="$GITHUB_REF_NAME"; else TAG=$(printf '%s' "$INPUT" | tr -d '[:space:]'); fi
          if [ -z "$TAG" ]; then
            echo "Packages only, no release"
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "release=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$TAG" in v[0-9]*) ;; *) TAG="v$TAG" ;; esac
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::$TAG is not a version like v0.9.0 or v0.9.0-rc.1"; exit 1
          fi
          # Releases come only from commits on main (docs/code-signing-policy.md).
          if [ "$EVENT" != push ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::A release is made from main, not from $GITHUB_REF_NAME"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main: a release is made only from main"; exit 1
          fi
          V=$(sed -n 's/^[[:space:]]*appVersion = "\(.*\)"/\1/p' core/version.go)
          if [ "v$V" != "$TAG" ]; then
            echo "::error::$TAG does not match appVersion $V in core/version.go on $GITHUB_REF_NAME"; exit 1
          fi
          # A release (published or draft) for this version already exists:
          # a tag from Publish, or a tag pushed after a release from the browser.
          if gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' | grep -qx "$TAG"; then
            if [ "$EVENT" = push ]; then
              echo "::notice::Release $TAG already exists: nothing to build"
              echo "build=false" >> "$GITHUB_OUTPUT"; echo "release=" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::Release $TAG already exists: delete its draft on the Releases page to build it again"; exit 1
          fi
          if [ "$EVENT" != push ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists without a release: push it again or delete it"; exit 1
          fi
          echo "Release $TAG from $GITHUB_SHA"
          echo "build=true" >> "$GITHUB_OUTPUT"; echo "release=$TAG" >> "$GITHUB_OUTPUT"; echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  windows-linux:
    name: Windows and Linux packages
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux libraries (WebKitGTK)
        run: bash build/ci-apt.sh
      # nfpm builds the .deb and .rpm: a fixed release, checked against its
      # checksum.
      - name: nfpm
        run: |
          curl -fsSLo "$RUNNER_TEMP/nfpm.tgz" https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz
          echo "a80d5f724ed70b192ffa8a2bde469c013cef559c8afa3441eb51dd9a918beb6b  $RUNNER_TEMP/nfpm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tgz" -C "$RUNNER_TEMP" nfpm
          echo "NFPM=$RUNNER_TEMP/nfpm" >> "$GITHUB_ENV"
      - name: Build packages
        run: bash build/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yacm-windows-linux
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          retention-days: 30

  msix:
    name: Microsoft Store package
    needs: [plan, windows-linux]
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: yacm-windows-linux
          path: in
      # The two YACM.exe of the zips, each in an MSIX package, and both in
      # the bundle that is uploaded to Partner Center. Unsigned: the Store
      # signs it, so it is not a release file.
      - name: Pack
        shell: bash
        run: |
          V=$(sed -n 's/^[[:space:]]*appVersion = "\(.*\)"/\1/p' core/version.go)
          mkdir -p store test
          for a in x64 arm64; do
            unzip -q "in/yacm-$V-windows-$a.zip" -d in
            bash build/windows/msix.sh "in/yacm-$V-windows-$a/YACM.exe" "$a" "$V" "test/yacm-$V-$a.msix" "in/yacm-$V-windows-$a/THIRD-PARTY-NOTICES.txt"
          done
          bash build/windows/msix.sh bundle "$V" "store/yacm-$V-store.msixbundle" "test/yacm-$V-x64.msix" "test/yacm-$V-arm64.msix"
          echo "V=$V" >> "$GITHUB_ENV"
      # Windows must accept the package: the x64 one is signed with a
      # throwaway certificate for the publisher in the manifest, installed
      # and removed again.
      - name: Test install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publisher = ([xml](Get-Content build/windows/msix/AppxManifest.xml)).Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          Export-Certificate -Cert $cert -FilePath test/test.cer | Out-Null
          Import-Certificate -FilePath test/test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' | Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          $pkg = "test/yacm-$env:V-x64.msix"
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint $pkg
          if ($LASTEXITCODE) { throw "signtool failed" }
          Add-AppxPackage -Path $pkg
          $p = Get-AppxPackage -Name TheYACMAuthors.YACM
          if (-not $p) { throw "the package is not installed" }
          "$($p.PackageFullName) in $($p.InstallLocation)"
          foreach ($f in 'YACM.exe', 'resources.pri', 'AppxManifest.xml') {
            if (-not (Test-Path (Join-Path $p.InstallLocation $f))) { throw "$f is missing from the package" }
          }
          Remove-AppxPackage -Package $p.PackageFullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-msix
          path: store/*.msixbundle
          retention-days: 30

  macos:
    name: macOS disk image and demo
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # The Apple signing secrets live in the environment "release", which
    # only the maintainer can approve (Settings > Environments).
    environment: release
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # With the Developer ID secrets the app is signed and notarised; without
      # them (a fork, say) it is signed ad hoc as before.
      - name: Developer ID certificate and notarisation key
        id: signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then echo "No Developer ID secrets: signing ad hoc"; exit 0; fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW=$(openssl rand -hex 24)
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          ID=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          if [ -z "$ID" ]; then echo "::error::No Developer ID Application identity in MACOS_CERT_P12"; exit 1; fi
          echo "identity=$ID" >> "$GITHUB_OUTPUT"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "key=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_OUTPUT"
          fi
      - name: Build YACM.app and .dmg
        env:
          MACOS_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_API_KEY_PATH: ${{ steps.signing.outputs.key }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: sh build/darwin/build-macos.sh
      - name: Remove the signing keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yacm-macos
          path: |
            dist-macos/*.dmg
            dist-macos/*.zip
          retention-days: 30

  publish:
    name: Draft GitHub release
    if: needs.plan.outputs.release != ''
    needs: [plan, windows-linux, msix, macos]
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write     # build provenance (public repository)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The yacm-* artifacts are the release files; the Store package
      # (store-msix) goes to Partner Center instead.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: yacm-*
          path: out
          merge-multiple: true
      # Software bill of materials: the Go modules and npm packages in the
      # build (go.mod / go.sum and frontend/package-lock.json), SPDX JSON.
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: out/yacm-${{ needs.plan.outputs.version }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Build provenance (SLSA) for every file: who built it, from which
      # commit and workflow. GitHub offers attestations for public
      # repositories (private ones need GitHub Enterprise).
      - name: Build provenance
        id: provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - name: SBOM attestation
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: 'out/*.zip, out/*.tar.gz, out/*.deb, out/*.rpm, out/*.dmg'
          sbom-path: out/yacm-${{ needs.plan.outputs.version }}-sbom.spdx.json
      # The provenance bundle also goes into the release, so it can be
      # checked offline (gh attestation verify FILE --bundle ...).
      - name: Provenance bundle as a release file
        if: ${{ !github.event.repository.private }}
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          TAG: ${{ needs.plan.outputs.release }}
        run: cp "$BUNDLE" "out/yacm-${TAG#v}-provenance.intoto.jsonl"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.release }}
        run: |
          node build/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
          # --target: the tag is created on this commit when the draft is
          # published (a tag that already exists keeps its commit).
          # A release candidate (v0.9.0-rc.1) is marked as a pre-release.
          PRE=""; case "$TAG" in *-rc.*) PRE="--prerelease" ;; esac
          gh release create "$TAG" out/* --draft $PRE --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "YACM ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
