# Contributor License Agreement (CLA.md): the bot asks the author of a first
# pull request to agree in a comment and keeps the signatures in the branch
# cla-signatures. It never checks out or runs the pull request's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: read

jobs:
  cla:
    # Dependabot's pull requests need no CLA (and get a read-only token).
    if: >-
      github.actor != 'dependabot[bot]' && (github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write        # the signatures file
      pull-requests: write   # the comment and label
      statuses: write
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: icavar,dependabot[bot],github-actions[bot],Claude
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before it can be merged, please read the
            [YACM Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and agree to it by posting the comment below. You keep the copyright in your work,
            and YACM stays free and open source. You only need to do this once.
