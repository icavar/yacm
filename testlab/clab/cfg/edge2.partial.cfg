! edge2: YACM test lab (partial startup config, merged with containerlab's default)
! Login lab / lab. SSH and telnet only from 10.0.0.0/8, so YACM has to come through the jump hosts.
!
hostname edge2
!
username lab privilege 15 role network-admin secret lab
aaa authorization exec default local
!
ip routing
!
interface Loopback0
   ip address 10.255.0.2/32
!
interface Ethernet1
   description bastion-locked
   no switchport
   ip address 10.0.3.2/30
!
interface Ethernet2
   description spine1
   no switchport
   ip address 10.1.0.4/31
   ip ospf network point-to-point
!
interface Ethernet3
   description spine2
   no switchport
   ip address 10.1.0.6/31
   ip ospf network point-to-point
!
ip prefix-list LAB seq 10 permit 10.0.0.0/8 le 32
!
route-map LAB-CONNECTED permit 10
   match ip address prefix-list LAB
!
router ospf 1
   router-id 10.255.0.2
   network 10.1.0.0/16 area 0.0.0.0
   redistribute connected route-map LAB-CONNECTED
!
ip access-list standard YACM-JUMP-ONLY
   10 permit 10.0.0.0/8
!
management ssh
   ip access-group YACM-JUMP-ONLY in
!
end
