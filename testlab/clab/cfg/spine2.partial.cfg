! spine2: YACM test lab (partial startup config, merged with containerlab's default)
! Login lab / lab. SSH and telnet only from 10.0.0.0/8, so YACM has to come through the jump hosts.
!
hostname spine2
!
username lab privilege 15 role network-admin secret lab
aaa authorization exec default local
!
ip routing
!
interface Loopback0
   ip address 10.255.0.12/32
!
interface Ethernet1
   description edge1
   no switchport
   ip address 10.1.0.3/31
   ip ospf network point-to-point
!
interface Ethernet2
   description edge2
   no switchport
   ip address 10.1.0.7/31
   ip ospf network point-to-point
!
interface Ethernet3
   description leaf1
   no switchport
   ip address 10.1.2.0/31
   ip ospf network point-to-point
!
interface Ethernet4
   description leaf2
   no switchport
   ip address 10.1.2.2/31
   ip ospf network point-to-point
!
interface Ethernet5
   description leaf3
   no switchport
   ip address 10.1.2.4/31
   ip ospf network point-to-point
!
interface Ethernet6
   description leaf4
   no switchport
   ip address 10.1.2.6/31
   ip ospf network point-to-point
!
ip prefix-list LAB seq 10 permit 10.0.0.0/8 le 32
!
route-map LAB-CONNECTED permit 10
   match ip address prefix-list LAB
!
router ospf 1
   router-id 10.255.0.12
   network 10.1.0.0/16 area 0.0.0.0
   redistribute connected route-map LAB-CONNECTED
!
ip access-list standard YACM-JUMP-ONLY
   10 permit 10.0.0.0/8
!
management ssh
   ip access-group YACM-JUMP-ONLY in
!
end
